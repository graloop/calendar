# Agenda on the home server, as a Portainer stack (see docs/server.md).
# Home network only: the page has no login, so never forward port 8030 on the
# router and never point a public tunnel at the page. Away from home, use
# Tailscale (docs/safety.md). The one exception is Claude's connector: a public
# hostname (MCP_HOST) that reaches only /mcp and its OAuth login, behind a
# password; the app answers a 404 to anything else on it (app/mcp/guard.py).
# Everything worth keeping is in the agenda_data volume: updating the app
# doesn't touch it.
services:
  agenda:
    # Built by GitHub Actions (.github/workflows/ci.yml) on every push to main
    # and published to GitHub's registry, so Portainer only has to pull it.
    # Tags: latest, the VERSION number (e.g. 1) and sha-<short commit>; set
    # TAG in the stack to go back to an earlier version.
    image: ghcr.io/graloop/agenda:${TAG:-latest}
    # A fixed name, so scripts/backup.sh can find it with `docker exec agenda`.
    container_name: agenda
    restart: unless-stopped
    environment:
      # The server's clock: what "today" and "this week" mean.
      TZ: ${TZ:-America/Toronto}
      # No Swagger page at /docs on the server.
      ENABLE_API_DOCS: "false"
      # Claude's connector (MCP_PLAN.md). Off unless set to true in the stack.
      MCP_ENABLED: ${MCP_ENABLED:-false}
      # The public hostname, e.g. agenda-mcp.graloop.com. On it the app answers
      # only /mcp and its OAuth login; everything else is a 404.
      MCP_HOST: ${MCP_HOST:-}
      # From `docker exec -it agenda python -m app.mcp.hashpw`: the hash, never the password.
      MCP_PASSWORD_HASH: ${MCP_PASSWORD_HASH:-}
      MCP_TOKEN_DAYS: ${MCP_TOKEN_DAYS:-30}
    ports:
      - "8030:8000"
    volumes:
      - agenda_data:/data

  # The tunnel for Claude's connector, the same as the training app's. Off unless
  # the stack has COMPOSE_PROFILES=tunnel. CLOUDFLARE_TUNNEL_TOKEN is the token
  # Cloudflare shows when you create the tunnel. In Cloudflare, give it ONE
  # public hostname (MCP_HOST), path ^/(mcp|oauth|\.well-known), service
  # http://agenda:8000. Never a hostname for the page (docs/server.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - agenda
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  agenda_data:
    # A fixed name: the calendar stays the same volume even if the stack is renamed.
    name: agenda_data
